<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="hs-footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="hs-footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#701A3D"/>
      <stop offset="100%" stop-color="#10070C"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="900" height="60" fill="url(#hs-footer-bg)"/>
  <rect x="100" y="12" width="700" height="1" fill="url(#hs-footer-line)"/>
  <text x="450" y="38" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#C77B9B" opacity="0.7">HARSHIT SINGH  ·  HARSHITBYTE-DS  ·  INDIA</text>
  <rect x="100" y="48" width="700" height="1" fill="url(#hs-footer-line)"/>
</svg>
