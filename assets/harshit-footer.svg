<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" width="900" height="72"
  role="img" aria-label="Build · Learn · Innovate">
  <defs>
    <linearGradient id="hf-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#10070C"/>
      <stop offset="50%"  stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="hf-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#10070C" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#451126" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#E5B5C7" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#451126" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hf-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#701A3D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hf-clip"><rect width="900" height="72"/></clipPath>
  </defs>

  <g clip-path="url(#hf-clip)">
    <rect width="900" height="72" fill="url(#hf-bg)"/>
    <rect width="900" height="72" fill="url(#hf-center)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Top rule -->
    <rect x="60" y="13" width="780" height="1" fill="url(#hf-rule)"/>

    <!-- Orbital ring -->
    <ellipse cx="450" cy="43" rx="22" ry="14" fill="none" stroke="#451126" stroke-width="0.7" opacity="0.5">
      <animate attributeName="rx" values="22;26;22" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Orbiting dot -->
    <circle r="2" fill="#C77B9B" opacity="0.9">
      <animateMotion dur="5s" repeatCount="indefinite">
        <mpath href="#hf-ring-path"/>
      </animateMotion>
    </circle>
    <path id="hf-ring-path" d="M 450 29 a 22 14 0 1 1 -0.1 0 Z" fill="none"/>

    <!-- Corner accents -->
    <g stroke="#701A3D" stroke-width="0.8" fill="none" opacity="0.6">
      <polyline points="62,13 60,13 60,15"/>
      <polyline points="838,13 840,13 840,15"/>
      <polyline points="62,59 60,59 60,57"/>
      <polyline points="838,59 840,59 840,57"/>
    </g>

    <!-- BUILD · LEARN · INNOVATE -->
    <text x="450" y="48" text-anchor="middle"
      font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
      font-size="12.5" font-weight="600" letter-spacing="8"
      fill="#C77B9B" opacity="0.9">BUILD  ·  LEARN  ·  INNOVATE</text>

    <!-- Bottom rule -->
    <rect x="60" y="59" width="780" height="1" fill="url(#hf-rule)"/>
  </g>
</svg>
