<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380"
  role="img" aria-label="Harshit Singh — CSE Student · Data Science · AI/ML · Python">
  <title>Harshit Singh</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A040A"/>
      <stop offset="50%"  stop-color="#130910"/>
      <stop offset="100%" stop-color="#0A040A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="55%" r="50%">
      <stop offset="0%"   stop-color="#6B1535" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.5;0.8;0.5" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0A040A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="40%" r="40%">
      <stop offset="0%"   stop-color="#3D0E22" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.4;0.7;0.4" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0A040A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0A040A" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#6B1535" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#C77B9B" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#6B1535" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A040A" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-line">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="380"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- BG -->
    <rect width="900" height="380" fill="url(#bg)"/>
    <rect width="900" height="380" fill="url(#glow1)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect width="900" height="380" fill="url(#glow2)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- FINE GRID -->
    <g stroke="#C77B9B" stroke-width="0.3" opacity="0.06">
      <line x1="0"   y1="95"  x2="900" y2="95"/>
      <line x1="0"   y1="190" x2="900" y2="190"/>
      <line x1="0"   y1="285" x2="900" y2="285"/>
      <line x1="112" y1="0"   x2="112" y2="380"/>
      <line x1="225" y1="0"   x2="225" y2="380"/>
      <line x1="337" y1="0"   x2="337" y2="380"/>
      <line x1="450" y1="0"   x2="450" y2="380"/>
      <line x1="562" y1="0"   x2="562" y2="380"/>
      <line x1="675" y1="0"   x2="675" y2="380"/>
      <line x1="787" y1="0"   x2="787" y2="380"/>
    </g>

    <!-- ORBITAL RINGS -->
    <ellipse cx="820" cy="70" rx="130" ry="80" fill="none" stroke="#3D0E22" stroke-width="0.8" opacity="0.6">
      <animate attributeName="rx" values="130;142;130" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="820" cy="70" rx="78" ry="48" fill="none" stroke="#6B1535" stroke-width="0.5" opacity="0.4">
      <animate attributeName="rx" values="78;88;78" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="3" fill="#C77B9B" opacity="0.9">
      <animateMotion dur="12s" repeatCount="indefinite">
        <mpath href="#orbit-tr"/>
      </animateMotion>
    </circle>
    <path id="orbit-tr" d="M 820 -10 a 130 80 0 1 1 -0.1 0 Z" fill="none"/>

    <ellipse cx="80" cy="310" rx="90" ry="55" fill="none" stroke="#3D0E22" stroke-width="0.6" opacity="0.5">
      <animate attributeName="rx" values="90;100;90" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="2" fill="#E5B5C7" opacity="0.7">
      <animateMotion dur="15s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#orbit-bl"/>
      </animateMotion>
    </circle>
    <path id="orbit-bl" d="M 80 255 a 90 55 0 1 0 0.1 0 Z" fill="none"/>

    <!-- WAVE PATHS -->
    <path fill="none" stroke="#6B1535" stroke-width="1.2" opacity="0.35"
      d="M -10 300 C 100 275 220 310 380 290 S 600 268 780 285 S 880 275 920 265">
      <animate attributeName="d"
        values="M -10 300 C 100 275 220 310 380 290 S 600 268 780 285 S 880 275 920 265;
                M -10 312 C 100 287 220 322 380 302 S 600 280 780 297 S 880 287 920 277;
                M -10 300 C 100 275 220 310 380 290 S 600 268 780 285 S 880 275 920 265"
        dur="10s" repeatCount="indefinite"/>
    </path>
    <path fill="none" stroke="#C77B9B" stroke-width="0.5" opacity="0.15"
      d="M -10 338 C 150 318 300 348 480 332 S 700 318 920 330">
      <animate attributeName="d"
        values="M -10 338 C 150 318 300 348 480 332 S 700 318 920 330;
                M -10 350 C 150 330 300 360 480 344 S 700 330 920 342;
                M -10 338 C 150 318 300 348 480 332 S 700 318 920 330"
        dur="14s" repeatCount="indefinite"/>
    </path>

    <!-- CORNER BRACKETS -->
    <g stroke="#6B1535" stroke-width="1.4" fill="none" opacity="0.8">
      <polyline points="24,8  8,8  8,26"/>
      <polyline points="876,8 892,8 892,26"/>
      <polyline points="24,372 8,372 8,354"/>
      <polyline points="876,372 892,372 892,354"/>
    </g>
    <circle cx="8"   cy="8"   r="2.5" fill="#C77B9B" opacity="0.7"/>
    <circle cx="892" cy="8"   r="2.5" fill="#C77B9B" opacity="0.7"/>
    <circle cx="8"   cy="372" r="2.5" fill="#C77B9B" opacity="0.7"/>
    <circle cx="892" cy="372" r="2.5" fill="#C77B9B" opacity="0.7"/>

    <!-- TOP RULE -->
    <rect x="60" y="52" width="780" height="1" fill="url(#rule)" filter="url(#glow-line)" opacity="0.7"/>

    <!-- LABEL -->
    <text x="60" y="44" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" letter-spacing="4"
      fill="#6B1535" opacity="0.9">CSE STUDENT  ·  DATA SCIENCE  ·  AI / ML  ·  PYTHON</text>

    <!-- NAME BLOOM -->
    <text x="60" y="168" font-family="Georgia,'Times New Roman',serif"
      font-size="82" font-style="italic" font-weight="700" letter-spacing="-1"
      fill="#C77B9B" opacity="0.09" filter="url(#bloom)">Harshit Singh.</text>

    <!-- NAME -->
    <text x="60" y="168" font-family="Georgia,'Times New Roman',serif"
      font-size="82" font-style="italic" font-weight="700" letter-spacing="-1"
      fill="#F8F0F3">Harshit</text>
    <text x="60" y="258" font-family="Georgia,'Times New Roman',serif"
      font-size="82" font-style="italic" font-weight="700" letter-spacing="-1"
      fill="#F8F0F3">Singh<tspan fill="#C77B9B">.</tspan></text>

    <!-- SUBTITLE -->
    <text x="62" y="292" font-family="'Segoe UI',system-ui,sans-serif"
      font-size="13" font-weight="400" letter-spacing="3.5"
      fill="#C77B9B" opacity="0.85">Engineering intelligence. Building solutions.</text>

    <!-- BOTTOM RULE -->
    <rect x="60" y="318" width="780" height="1" fill="url(#rule)" filter="url(#glow-line)" opacity="0.5"/>

    <!-- BOTTOM LABEL -->
    <text x="60" y="338" font-family="'Segoe UI',system-ui,sans-serif"
      font-size="10" letter-spacing="3" fill="#E5B5C7" opacity="0.4">INDIA  ·  B.TECH CSE  ·  OPEN TO OPPORTUNITIES</text>

    <!-- DECORATIVE DOTS -->
    <g fill="#6B1535">
      <circle cx="62"  cy="358" r="1.5" opacity="0.6"/>
      <circle cx="72"  cy="358" r="1"   opacity="0.4"/>
      <circle cx="80"  cy="358" r="0.7" opacity="0.3"/>
    </g>
  </g>
</svg>
